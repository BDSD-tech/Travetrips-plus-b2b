<header class="main-header">
    <nav class="navbar navbar-expand-lg navbar-light main-navbar">
        <div class="container">
            <!-- LOGO -->
            <a class="navbar-brand logo-link" routerLink="/">
                <img [src]="GetWebSiteData?.Logo" alt="TravelTrip Logo" class="logo-img img-fluid" />
            </a>

            <!-- MOBILE TOGGLE -->
            <button class="navbar-toggler mobile-toggle" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- RIGHT SIDE -->
            <div class="collapse navbar-collapse" id="mainMenu">
                <div class="header-actions">
                    <!-- SUPPORT INFO -->
                    <div class="support-info">
                        <i class="fa-solid fa-headset"></i>
                        <div>
                            <p>24/7 Support</p>
                            <h5 class="support-number">+91 8800114161</h5>
                        </div>
                    </div>

                    <!-- AUTH BUTTONS -->
                    <a class="login-btn" routerLink="/login">Login</a>
                    <a class="register-btn" routerLink="/register">Register</a>
                </div>
            </div>
        </div>
    </nav>
</header>
@if(loading===false){

<section class="breadcrum__text-page">
    <div class="container">
        <div class="breadcrum__text">
            <a routerLink="/" class="breadcrum__text--link">
                <i class="fa fa-home"></i> Home
            </a>
            <i class="fa fa-angle-double-right mx-2"></i>
            <span>{{Response['Title']}}</span>
        </div>
    </div>
</section>

}

<section class="page-content">
    <div class="container">
        @if(loading===false){
        <div [innerHTML]="Response['Content']|safeHtml"></div>
        }

        @if(loading){
        <div>
            <div class="loader-content text-center">
                <div class="spinner-border" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <p class="mt-3 text-center">Loading...</p>
            </div>
        </div>
        }
    </div>
</section>

<footer class="main-footer">
   <div class="container">
      <div class="footer-wrapper">
         <!-- LEFT -->
         <div class="footer-left">
            <span>
               {{GetWebSiteData['CopyRight']}}
            </span>

            <a href="javascript:void(0);" routerLink="/pages/contact-us" target="blank">
               Contact Us
            </a>

            <a href="javascript:void(0);"  routerLink="pages/page/web-check-in" target="blank">
               Web Check-in
            </a>

            <a href="javascript:void(0);"  routerLink="pages/page/privacy-policy" target="blank">
               Privacy Policy
            </a>

            <a href="javascript:void(0);"  routerLink="pages/page/Cancellation" target="blank">
               Refund & Cancellation Policy
            </a>

            <a href="javascript:void(0);"  routerLink="pages/page/term-condition" target="blank">
               Terms & Conditions
            </a>
         </div>

         <!-- RIGHT -->
         <div class="footer-social">
            <a href="javascript:void(0);" class="social-icon">
               <i class="fab fa-facebook-f"></i>
            </a>

            <a href="javascript:void(0);" class="social-icon">
               <i class="fab fa-instagram"></i>
            </a>

            <a href="javascript:void(0);" class="social-icon">
               <i class="fab fa-x-twitter"></i>
            </a>
         </div>
      </div>
   </div>
</footer>
