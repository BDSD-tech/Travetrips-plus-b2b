 <section class="p-3 page-content">
    <div class="container">
        @if(loading===false){
        <div  [innerHTML]="Response['Content']|safeHtml"></div>
    }   
    
    @if(loading){
    <div>
      <div class="loader-content text-center">
        <div class="spinner-border" role="status">
          <span class="sr-only">Loading...</span>
        </div>
        <p class="mt-3 text-center">Loading...</p>
      </div>
    </div>
    }
    </div>
  </section>
