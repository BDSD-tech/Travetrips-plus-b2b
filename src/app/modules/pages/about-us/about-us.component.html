
<section class="breadcrum__text-page">
    <div class="container">
        <div class="breadcrum__text">
            <a routerLink="/" class="breadcrum__text--link">
                <i class="fa fa-home"></i> Home
            </a>
            <i class="fa fa-angle-double-right mx-2"></i>
            <span>About Us</span>
        </div>
    </div>
</section>

<section class="about-section">
    <div class="container">
        <div *ngFor="let item of details" class="about-card">
            <!-- Main Title -->
            <h3 class="about-heading-main">{{ item.Title }}</h3>
            <!-- Main Description -->
            <p class="about-text" *ngIf="item.Description">{{ item.Description }}</p>
            <!-- Sub Items -->
            <div *ngIf="item.Subitem?.length">
                <div *ngFor="let sub of item.Subitem" class="sub-box">
                    <h5 class="about-heading">{{ sub.SubTitle }}</h5>
                    <p class="about-text">{{ sub.SubDec }}</p>
                </div>
            </div>
        </div>
    </div>
</section>
