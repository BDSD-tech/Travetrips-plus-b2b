@if(display == 'on'){
<div class="tts-session-timer">
    <div class="timer-card">
        <i class="fas fa-clock timer-icon"></i>

        <div class="timer-content">
            <span class="timer-text">Your session will expire in</span>
            <span class="timer-count">
                {{minutesToDday}}mins : {{secondsToDday}}secs
            </span>
        </div>
    </div>
</div>
}
