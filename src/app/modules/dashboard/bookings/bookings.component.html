<div class="booking-wrapper">
    <div class="top-tabs">

        <button class="btn" [ngClass]="{'active-tab':activeService=='Flight'}" 
        (click)="activeService='Flight'"> Flights</button>

        <button class="btn" [ngClass]="{'active-tab':activeService=='Hotel'}"
            (click)="activeService='Hotel'">Hotels</button>

        <button class="btn" [ngClass]="{'active-tab':activeService=='Bus'}" 
        (click)="activeService='Bus'">Bus</button>

    </div>
    
    @if(activeService=='Flight'){
    <app-manage-carts></app-manage-carts>
    }@else if(activeService=='Hotel'){
    <app-manage-cart-hotel></app-manage-cart-hotel>
    }@else if(activeService=='Bus'){
    <app-booking-list></app-booking-list>
    }   
</div>
